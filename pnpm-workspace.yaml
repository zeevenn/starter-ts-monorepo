shellEmulator: true

trustPolicy: no-downgrade
packages:
  - apps/*
  - packages/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.3.0
    '@changesets/changelog-github': ^1.0.1
    '@changesets/cli': ^3.0.3
    '@inquirer/prompts': ^8.7.5
    eslint: ^10.13.0
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0
    tsdown: ^0.23.2
    tsx: ^4.23.15
    typescript: ^6.0.3
  testing:
    vite: ^8.3.5
    vitest: ^4.1.11
  types:
    '@types/node': ^26.6.5

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
