shellEmulator: true

trustPolicy: no-downgrade
packages:
  - apps/*
  - packages/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.3.0
    '@changesets/changelog-github': ^1.0.0
    '@changesets/cli': ^3.0.1
    '@inquirer/prompts': ^8.7.0
    eslint: ^10.9.1
    lint-staged: ^17.4.1
    simple-git-hooks: ^2.14.0
    tsdown: ^0.22.14
    tsx: ^4.23.13
    typescript: ^6.0.3
  testing:
    vite: ^8.2.2
    vitest: ^4.1.11
  types:
    '@types/node': ^26.4.0

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
