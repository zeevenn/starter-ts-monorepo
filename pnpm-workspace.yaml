shellEmulator: true

trustPolicy: no-downgrade
packages:
  - apps/*
  - packages/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@changesets/changelog-github': ^1.0.1
    '@changesets/cli': ^3.0.2
    '@inquirer/prompts': ^8.7.2
    eslint: ^10.10.0
    lint-staged: ^17.5.0
    simple-git-hooks: ^2.14.0
    tsdown: ^0.23.0
    tsx: ^4.23.13
    typescript: ^6.0.3
  testing:
    vite: ^8.2.2
    vitest: ^4.1.11
  types:
    '@types/node': ^26.5.0

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
